# Serves the pre-rendered Docusaurus output. TLS and the public hostname are handled by the host
# nginx in front of this container.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The build emits <route>/index.html because trailingSlash is on.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML must revalidate, or a legal document could stay stale in a cache after an update.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    # This container is only reachable through the host nginx; it adds the security headers.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

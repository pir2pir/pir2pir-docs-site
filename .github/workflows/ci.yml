name: CI

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]
  # Fired by pir2pir-docs when its content changes, with ref set to the matching branch.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DOCS_REPO: pir2pir/pir2pir-docs
  # Content follows the engine branch: develop builds against develop content, production against
  # production content. A pull request builds against production, the published content.
  DOCS_BRANCH: ${{ github.event_name == 'pull_request' && 'production' || github.ref_name }}

jobs:
  build-test:
    name: Build & test
    runs-on: [self-hosted, macmini]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCS_REPO }}
          ref: ${{ env.DOCS_BRANCH }}
          path: external-docs
          token: ${{ secrets.DOCS_REPO_TOKEN || github.token }}

      - name: Replace docs and translations with content repo
        run: |
          set -euo pipefail
          test -f external-docs/docs/index.md \
            || { echo "::error::content repo has no docs/index.md — refusing to build"; exit 1; }
          rm -rf docs i18n
          mv external-docs/docs ./docs
          [ -d external-docs/i18n ] && mv external-docs/i18n ./i18n || true
          rm -rf external-docs

      - run: npm run typecheck

      - run: npm run build

      - name: Verify every locale and the legal pages built
        run: |
          set -euo pipefail
          for path in \
            build/index.html build/en/index.html build/uz/index.html \
            build/legal/consent/index.html \
            build/en/legal/consent/index.html \
            build/uz/legal/consent/index.html
          do
            test -f "$path" || { echo "::error::missing $path"; exit 1; }
          done
          echo "all locales and legal pages present"

  publish-image:
    name: Build & push image (GHCR)
    # Not for pull requests: build the image ONCE here (tagged by commit sha) so a later merge to
    # production deploys this exact image without rebuilding from scratch. A content-only change
    # arrives as workflow_dispatch and must publish too, since the engine commit has not moved.
    if: github.event_name != 'pull_request'
    needs: build-test

    runs-on: [self-hosted, macmini]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCS_REPO }}
          ref: ${{ env.DOCS_BRANCH }}
          path: external-docs
          token: ${{ secrets.DOCS_REPO_TOKEN || github.token }}

      - name: Stage content into the build context
        run: |
          set -euo pipefail
          rm -rf docs i18n
          mv external-docs/docs ./docs
          [ -d external-docs/i18n ] && mv external-docs/i18n ./i18n || true
          rm -rf external-docs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCSEARCH_APP_ID=${{ secrets.DOCSEARCH_APP_ID }}
            DOCSEARCH_API_KEY=${{ secrets.DOCSEARCH_API_KEY }}
            DOCSEARCH_INDEX_NAME=${{ secrets.DOCSEARCH_INDEX_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

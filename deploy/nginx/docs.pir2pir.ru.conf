# nginx site for the Pir2pir docs. Install to /etc/nginx/conf.d/docs.pir2pir.ru.conf on the host.
# TLS terminates here (the pir2pir.ru cert covers the wildcard); the container listens on
# 127.0.0.1:8081 and already serves correct cache headers, so this block only proxies.

server {
    listen 80;
    listen [::]:80;
    server_name docs.pir2pir.ru;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.pir2pir.ru;

    ssl_certificate     /etc/ssl/pir2pir.ru.pem;
    ssl_certificate_key /etc/ssl/pir2pir.ru.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/docs.pir2pir.ru.access.log;
    error_log  /var/log/nginx/docs.pir2pir.ru.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}

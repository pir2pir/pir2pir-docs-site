# Documentation — docs.pir2pir.ru. Container listens on 127.0.0.1:8081.

server {
    listen 80;
    listen [::]:80;
    server_name docs.pir2pir.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.pir2pir.ru;

    include snippets/pir2pir-tls.conf;
    include snippets/pir2pir-headers.conf;

    access_log /var/log/nginx/docs.pir2pir.ru.access.log;
    error_log  /var/log/nginx/docs.pir2pir.ru.error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;
        include    snippets/pir2pir-proxy.conf;

        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
    }

    location @unavailable {
        default_type text/html;
        return 503 "<!doctype html><meta charset=utf-8><title>Pir2Pir Docs</title><body style=\"font-family:system-ui;margin:4rem auto;max-width:32rem;line-height:1.6\"><h1>Документация недоступна</h1><p>Сервис временно недоступен. Попробуйте позже.</p><p><a href=\"https://t.me/pir2pirbot\">Telegram-бот</a></p></body>";
    }
}
